name: Deploy Development

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-development
  cancel-in-progress: false

env:
  NODE_VERSION: '22'
  FIREBASE_PROJECT_ID: mmg-concierge-dev
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  deploy:
    name: Firebase Development
    if: >-
      ${{
        (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment:
      name: development

    steps:
      - name: Resolve deployment revision
        id: revision
        shell: bash
        env:
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_run" ]]; then
            echo "sha=${WORKFLOW_RUN_SHA}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout validated main revision
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.revision.outputs.sha }}
          fetch-depth: 2

      - name: Decide whether Firebase resources changed
        id: changes
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git rev-parse HEAD^ >/dev/null 2>&1 && \
             git diff --quiet HEAD^ HEAD -- apps/functions firebase firebase.json .firebaserc; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "No Firebase backend or rules changes in this main revision."
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Explain disabled development CD
        if: steps.changes.outputs.deploy == 'true' && vars.MMG_DEV_CD_ENABLED != 'true'
        run: |
          echo "Development CD is installed but intentionally disabled."
          echo "Set repository variable MMG_DEV_CD_ENABLED=true after Workload Identity Federation is configured."

      - name: Validate deployment identity configuration
        if: steps.changes.outputs.deploy == 'true' && vars.MMG_DEV_CD_ENABLED == 'true'
        shell: bash
        env:
          WIF_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
        run: |
          if [[ -z "${WIF_PROVIDER}" || -z "${DEPLOY_SERVICE_ACCOUNT}" ]]; then
            echo "Missing GCP_WORKLOAD_IDENTITY_PROVIDER or GCP_DEPLOY_SERVICE_ACCOUNT repository variable."
            exit 1
          fi

      - name: Authenticate to Google Cloud with OIDC
        if: steps.changes.outputs.deploy == 'true' && vars.MMG_DEV_CD_ENABLED == 'true'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          project_id: mmg-concierge-dev
          create_credentials_file: true
          export_environment_variables: true

      - name: Set up Node.js
        if: steps.changes.outputs.deploy == 'true' && vars.MMG_DEV_CD_ENABLED == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        if: steps.changes.outputs.deploy == 'true' && vars.MMG_DEV_CD_ENABLED == 'true'
        run: npm ci

      - name: Rebuild Functions before deployment
        if: steps.changes.outputs.deploy == 'true' && vars.MMG_DEV_CD_ENABLED == 'true'
        run: npm run functions:build

      - name: Deploy Firebase backend and rules to development
        if: steps.changes.outputs.deploy == 'true' && vars.MMG_DEV_CD_ENABLED == 'true'
        run: >-
          npx -y firebase-tools@latest deploy
          --project mmg-concierge-dev
          --only functions,firestore,storage
          --non-interactive

      - name: Record deployment boundary
        if: steps.changes.outputs.deploy == 'true' && vars.MMG_DEV_CD_ENABLED == 'true'
        run: |
          echo "Deployed revision: ${{ steps.revision.outputs.sha }}"
          echo "Firebase target: mmg-concierge-dev"
          echo "Production target mmg-concierge was not used."
