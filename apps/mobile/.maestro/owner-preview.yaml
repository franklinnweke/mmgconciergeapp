# Starts signed in via List your car as an approved development owner with an existing image.
# VEHICLE_ID is the test listing ID, not a Storage path or signed URL.
appId: com.mmgconcierge.app
name: Private owner preview renders after image load
---
- launchApp
- extendedWaitUntil:
    visible: "Manage fleet"
    timeout: 15000
- tapOn: "Manage fleet"
- extendedWaitUntil:
    visible:
      id: "owner-vehicle-photo-${VEHICLE_ID}"
    timeout: 30000
- stopApp
- launchApp
- tapOn: "Manage fleet"
- extendedWaitUntil:
    visible:
      id: "owner-vehicle-photo-${VEHICLE_ID}"
    timeout: 30000
